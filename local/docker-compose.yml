# Local, production-shaped stack for manual testing before AWS:
#   nginx (web tier + stands in for CloudFront/S3 on /static/) -> tomcat 9 (app tier) -> mysql 8 + redis
# Start: make local-up   Open: http://localhost:8088   Stop: make local-down
name: java3tier-local

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: local-root-pw
      MYSQL_DATABASE: UserDB
      MYSQL_USER: appuser
      MYSQL_PASSWORD: local-app-pw
    volumes:
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocal-root-pw"]
      interval: 5s
      retries: 30

  redis:
    # Same restrictions as ElastiCache: auth token required, CONFIG disabled.
    image: redis:7.2
    command: ["redis-server", "--requirepass", "local-redis-pw", "--rename-command", "CONFIG", "\"\""]

  tomcat:
    image: tomcat:9.0-jdk11-temurin
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/UserDB?sslMode=REQUIRED
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: local-app-pw
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: local-redis-pw
      SPRING_REDIS_SSL: "false"
    volumes:
      - ../Java-Login-App/target/dptweb.war:/usr/local/tomcat/webapps/ROOT.war:ro

  nginx:
    image: nginx:1.27
    depends_on: [tomcat]
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web-static/static:/usr/share/nginx/static:ro
