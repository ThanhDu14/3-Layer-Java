server {
    listen 80;

    # In AWS, CloudFront serves /static/* from S3.
    location /static/ {
        alias /usr/share/nginx/static/;
    }

    location / {
        proxy_pass http://tomcat:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
