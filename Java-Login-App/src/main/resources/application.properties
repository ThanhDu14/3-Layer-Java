spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=.jsp

# Datasource settings come from the environment (SPRING_DATASOURCE_*), rendered on the server.

# The NLB health check hits /actuator/health/lb, which only checks the app itself:
# an RDS or Redis failover must not take every Tomcat out of the target group.
management.endpoints.web.exposure.include=health
management.endpoint.health.group.lb.include=ping

# Sessions (login + CSRF token) live in Redis so every Tomcat in the ASG can serve any request.
# Redis host/port/password/ssl come from the environment (SPRING_REDIS_*).
# ElastiCache blocks the CONFIG command, so Spring Session must not try to configure keyspace events.
spring.session.store-type=redis
spring.session.redis.configure-action=none
spring.session.timeout=30m
