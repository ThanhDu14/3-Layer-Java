---
- name: Install OpenSSH server (AL2023)
  ansible.builtin.dnf:
    name: openssh-server
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install OpenSSH server (Ubuntu)
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

# sshd uses the first value it sees and the Include of sshd_config.d comes first,
# so the settings go at the top of the file.
- name: Harden sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^{{ item.key }}\\s"
    line: "{{ item.key }} {{ item.value }}"
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  loop:
    - { key: PasswordAuthentication, value: "no" }
    - { key: PermitRootLogin, value: "no" }
  loop_control:
    label: "{{ item.key }}"
  notify: Reload sshd

- name: Install CloudWatch agent (AL2023)
  ansible.builtin.dnf:
    name: amazon-cloudwatch-agent
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Check CloudWatch agent (Ubuntu)
  ansible.builtin.stat:
    path: /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent
  register: common_cw_agent_bin
  when: ansible_facts['os_family'] == 'Debian'

- name: Install CloudWatch agent (Ubuntu)
  ansible.builtin.apt:
    deb: "{{ common_cw_agent_deb_url }}"
  when:
    - ansible_facts['os_family'] == 'Debian'
    - not common_cw_agent_bin.stat.exists

- name: Render CloudWatch agent config
  ansible.builtin.template:
    src: amazon-cloudwatch-agent.json.j2
    dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart CloudWatch agent

- name: Enable CloudWatch agent
  ansible.builtin.systemd_service:
    name: amazon-cloudwatch-agent
    enabled: true
    state: "{{ 'started' if java3tier_services_started else omit }}"
  when: java3tier_services_enabled
