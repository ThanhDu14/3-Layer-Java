---
- name: Reload sshd
  ansible.builtin.systemd_service:
    name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
    state: reloaded
  when: java3tier_services_started

- name: Restart CloudWatch agent
  ansible.builtin.systemd_service:
    name: amazon-cloudwatch-agent
    state: restarted
  when: java3tier_services_started
